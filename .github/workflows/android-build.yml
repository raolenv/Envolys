name: Build Android

"on":
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  android:
    name: Android (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > "$SDK_ROOT/licenses/intel-android-extra-license"
          yes | timeout 180 "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "cmake;4.1.2" "ndk;30.0.16248370" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew :androidApp:assembleRelease --stacktrace
          else
            ./gradlew :androidApp:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: envolys-android-${{ inputs.build_type }}
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
